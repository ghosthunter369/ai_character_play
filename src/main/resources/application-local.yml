spring:
  application:
    name: AiChat
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/aichat}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      database: 0
server:
  port: 8123
  servlet:
    context-path: /api
    # springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.character.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
    # AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-plus-2025-07-28
      log-requests: true
      log-responses: true
      max-tokens: 8192
xunfei:
  app-id: ${XUNFEI_APP_ID:}
  access-key-id: ${XUNFEI_ACCESS_KEY_ID:}
  access-key-secret: ${XUNFEI_ACCESS_KEY_SECRET:}
  tts-vcn: x5_lingfeiyi_flow
  tts-audio-encoding: lame
  tts-audio-sampleRate: 24000
app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
# 日志配置
logging:
  level:
    com.character: DEBUG
    org.java_websocket: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
